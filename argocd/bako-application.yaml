apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bako
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/haithamswelam/Bako.git
    targetRevision: main
    path: K8s
  destination:
    server: https://kubernetes.default.svc
    namespace: bako
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true