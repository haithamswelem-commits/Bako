apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bako-db-credentials
  namespace: bako
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: bako-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: bako/db-credentials